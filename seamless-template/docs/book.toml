[book]
title = "seamless-template Documentation"
description = "Documentation for seamless-template - A Polkadot Dapp built with kit-dot"
authors = ["seamless-template Team"]
language = "en"
multilingual = false
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/your-org/seamless-template"
edit-url-template = "https://github.com/your-org/seamless-template/edit/main/docs/{path}"

[output.html.playground]
copyable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3